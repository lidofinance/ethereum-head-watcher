name: Tests and checks

on: [push]

permissions:
  contents: read
  security-events: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup poetry
        run: >
          curl -sSL https://install.python-poetry.org | python - &&
          echo "$POETRY_HOME/bin" >> "$GITHUB_PATH"
        env:
          POETRY_HOME: "/opt/poetry"
          POETRY_VERSION: 1.3.2

      - name: Install dependencies
        run: |
          poetry install --no-interaction --with=dev

      # Two steps rather than one run, so a provider being slow is distinguishable at a glance
      # from the watcher deciding something wrong. Both are required.
      - name: Test with pytest (no providers needed)
        run: poetry run pytest tests -m "not integration"
        env:
          DRY_RUN: true

      # GitHub masks a secret only where its whole value appears, and requests reports a failed call by its
      # path alone ("with url: /v2/<key>/..."), so the path, the query and every long part of them are masked too.
      - name: Mask the provider keys inside the endpoint URLs
        shell: bash
        env:
          CL: ${{ secrets.CL_API_URL }}
          EL: ${{ secrets.EXECUTION_API_URL }}
          KAPI: ${{ secrets.KEYS_API_URL }}
        run: |
          for list in "$CL" "$EL" "$KAPI"; do
            IFS=',' read -ra urls <<< "$list"
            for url in "${urls[@]}"; do
              rest="${url#*://}"
              host="${rest%%[/?]*}"
              [[ "$host" == *@* ]] && echo "::add-mask::${host%@*}"
              tail="${rest:${#host}}"
              tail="${tail#/}"
              [ -z "$tail" ] && continue
              echo "::add-mask::$tail"
              IFS='/?&=' read -ra parts <<< "$tail"
              for part in "${parts[@]}"; do
                [ "${#part}" -ge 24 ] && echo "::add-mask::$part"
              done
            done
          done

      - name: Test with pytest (replays against live providers)
        run: poetry run pytest tests -m integration
        env:
          CONSENSUS_CLIENT_URI: ${{ secrets.CL_API_URL }}
          EXECUTION_CLIENT_URI: ${{ secrets.EXECUTION_API_URL }}
          LIDO_LOCATOR_ADDRESS: "${{ secrets.LIDO_LOCATOR }}"
          KEYS_API_URI: ${{ secrets.KEYS_API_URL }}
          DRY_RUN: true


  linters:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup poetry
        run: >
          curl -sSL https://install.python-poetry.org | python - &&
          echo "$POETRY_HOME/bin" >> "$GITHUB_PATH"
        env:
          POETRY_HOME: "/opt/poetry"
          POETRY_VERSION: 1.3.2

      - name: Install dependencies
        run: |
          poetry install --no-interaction --with=dev

      - name: Lint with black
        run: poetry run black --check tests

      - name: Lint with pylint
        run: poetry run pylint src tests

      - name: Lint mypy
        run: poetry run mypy src

      - name: Lint isort
        run: poetry run isort --check src
